name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      # Build also runs the Roslyn analyzers (latest-recommended); warnings are
      # errors, so a static-analysis finding fails the build.
      - name: Build (static analysis)
        run: dotnet build -c Release --no-restore

      # The xUnit suite runs against Moq-mocked AMQP send/receive seams and constructible
      # Amqp.Message objects — no Artemis, no network.
      - name: Test with coverage gate (>=90% line)
        run: dotnet test -c Release /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:Threshold=90 /p:ThresholdType=line /p:ThresholdStat=total

  conformance:
    name: Conformance suite in sync
    runs-on: ubuntu-latest
    env:
      BQ_CONFORMANCE_VERSION: 1.6.0
      # sha256 of that release's fetch.sh: the script runs on the runner, so it is pinned rather
      # than trusted from a mutable tag. Bump together with BQ_CONFORMANCE_VERSION.
      BQ_FETCH_SH_SHA256: 8bb6ba567b288fb0ac71a70fd17041b2503df119e01998d76fdad372570bf849
    steps:
      - uses: actions/checkout@v5
      - name: Verify vendored conformance matches the pinned release asset
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/fetch.sh" \
            "https://raw.githubusercontent.com/BabelQueue/conformance/v${BQ_CONFORMANCE_VERSION}/fetch.sh"
          echo "${BQ_FETCH_SH_SHA256}  $RUNNER_TEMP/fetch.sh" | sha256sum -c -
          bash "$RUNNER_TEMP/fetch.sh" --check "$BQ_CONFORMANCE_VERSION" "tests/BabelQueue.Artemis.Tests/conformance"

  # Opt-in live-broker tests (Artemis service container). Runs on push to main and on manual
  # dispatch only; it is deliberately NOT in `ci-green` needs, so it is never a required check.
  integration:
    name: Integration (live Artemis)
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      artemis:
        image: apache/activemq-artemis:2.37.0
        ports:
          - 5672:5672
          - 61616:61616
        env:
          ARTEMIS_USER: artemis
          ARTEMIS_PASSWORD: artemis
        options: >-
          --health-cmd "/var/lib/artemis-instance/bin/artemis check node --up --user artemis --password artemis"
          --health-interval 10s --health-timeout 10s --health-retries 12 --health-start-period 20s
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Integration tests
        env:
          BQ_INTEGRATION: "1"
          BQ_ARTEMIS_URL: amqp://artemis:artemis@localhost:5672
        run: dotnet test -c Release --filter "FullyQualifiedName~ArtemisIntegrationTests"

  ci-green:
    name: CI green
    runs-on: ubuntu-latest
    needs: [test, conformance]
    if: ${{ always() }}
    steps:
      - name: Fail if any required job did not pass
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "A required job failed or was cancelled."
            exit 1
          fi
