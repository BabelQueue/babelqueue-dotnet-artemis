name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test -c Release

      - name: Pack
        run: dotnet pack src/BabelQueue.Artemis/BabelQueue.Artemis.csproj -c Release -o artifacts

      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  # Manual dry run: exercises only the NuGet Trusted Publishing login (no test, pack, push
  # or GitHub release), so the nuget.org policy can be verified without cutting a version.
  verify-trusted-publishing:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Verify the short-lived API key was issued
        env:
          KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "Trusted Publishing login OK"
          else
            echo "Trusted Publishing login returned an empty API key" >&2
            exit 1
          fi
